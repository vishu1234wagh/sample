<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Bootstrap Example</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark p-3">
        <div class="container">
            <a class="navbar-brand" href="#">My Website</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">

        <h1 class="text-primary">Welcome to Bootstrap</h1>

        <p class="lead">
            Bootstrap helps create responsive and beautiful websites easily.
        </p>

        <!-- Buttons -->
        <button class="btn btn-primary">Primary Button</button>
        <button class="btn btn-success">Success Button</button>

        <!-- Grid -->
        <div class="row mt-4">

            <div class="col-md-4">
                <div class="bg-info text-white p-4 rounded">
                    Box 1
                </div>
            </div>

            <div class="col-md-4">
                <div class="bg-warning p-4 rounded">
                    Box 2
                </div>
            </div>

            <div class="col-md-4">
                <div class="bg-danger text-white p-4 rounded">
                    Box 3
                </div>
            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

  </boby>
  </html>
